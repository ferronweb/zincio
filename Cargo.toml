[workspace]
members = ["zincio", "examples", "zincio-hyper", "zincio-quinn"]
resolver = "2"

[workspace.dependencies]
zincio = { version = "=0.2.24", default-features = false }
zincio-hyper = "=0.2.24"
zincio-quinn = "=0.2.24"

[patch.crates-io]
zincio = { path = "./zincio" }
zincio-hyper = { path = "./zincio-hyper" }
zincio-quinn = { path = "./zincio-quinn" }
